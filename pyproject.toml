[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchmap"
version = "0.1.0"
description = "Per-player position heatmaps for football matches from a wide tactical camera"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
